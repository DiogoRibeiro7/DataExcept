[project]
name = "DataExcept"
version = "0.2.1"
description = "A Python package providing structured, easily-extendable custom exception types."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
authors = [{ name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt" }]
maintainers = [{ name = "Diogo Ribeiro", email = "diogo.debastos.ribeiro@gmail.com" }]
keywords = ["exceptions", "errors", "logging"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "tomli ; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/DataExcept"
Repository = "https://github.com/DiogoRibeiro7/DataExcept"
Documentation = "https://diogoribeiro7.github.io/DataExcept/"
Changelog = "https://github.com/DiogoRibeiro7/DataExcept/releases"
Issues = "https://github.com/DiogoRibeiro7/DataExcept/issues"

[project.scripts]
dataexcept = "dataexcept.__main__:main"

[tool.poetry]
packages = [{ include = "dataexcept" }]
include = [
    "CITATION.cff",
    "CHANGELOG.md",
]

[tool.poetry.group.dev.dependencies]
black = "*"
coverage = "*"
flake8 = "*"
isort = "*"
mypy = "*"
pre-commit = "*"
pytest = "*"
ruff = "*"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.5,<10"
mkdocstrings = { extras = ["python"], version = ">=0.26" }

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# S = flake8-bandit (security), C90 = mccabe (complexity). Both ship with ruff,
# so neither needs a separate tool in CI.
select = ["E", "F", "S", "C90"]
ignore = []

[tool.ruff.lint.mccabe]
# The most complex function in the package currently scores 6. Eight leaves
# room to breathe while still catching a function that grows out of hand.
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# assert is how a test asserts, and "/tmp/data" there is a string literal used
# as fixture data rather than a path that is ever opened.
"tests/**" = ["S101", "S108", "S603"]
# The lambda example asserts to narrow Optionals for the type checker.
"examples/**" = ["S101"]
# bump_version.py deliberately shells out to poetry, by name, on a maintainer's
# own machine.
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.10"
files = ["dataexcept"]
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true

site_name: DataExcept
site_description: Structured, hierarchical exception classes for data science, machine learning and data engineering workflows.
site_author: Diogo Ribeiro
site_url: https://diogoribeiro7.github.io/DataExcept/

repo_url: https://github.com/DiogoRibeiro7/DataExcept
repo_name: DiogoRibeiro7/DataExcept
edit_uri: edit/main/docs/

copyright: Copyright &copy; Diogo Ribeiro — MIT licensed

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            docstring_section_style: table
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Command-Line Interface: cli.md
  - Logging Helpers: logging.md
  - Advanced Usage: advanced_usage.md
  - API Reference: api.md
  - API Stability: stability.md
  - Migrating to 1.0: migration.md
  - Releasing: releasing.md
  - Citation: citation.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DiogoRibeiro7/DataExcept
      name: DataExcept on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/DataExcept/
      name: DataExcept on PyPI

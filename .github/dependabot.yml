version: 2

# Poetry and pre-commit pin the same developer tools in two different places.
# Updating them in one Dependabot PR keeps local hooks and CI on the same
# versions instead of relying on a maintainer to reconcile two separate bumps.
multi-ecosystem-groups:
  python-tooling:
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps-dev)"
    open-pull-requests-limit: 10

updates:
  # Python dependencies and pre-commit hooks move together because
  # tests/test_dependency_declarations.py requires shared tools (ruff, black,
  # isort and mypy) to have identical versions in poetry.lock and hook revs.
  - package-ecosystem: "pip"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "python-tooling"

  - package-ecosystem: "pre-commit"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "python-tooling"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    # One pull request for all action bumps. Separate per-action pull requests
    # edit adjacent lines of the same workflow and conflict with each other as
    # soon as one of them merges.
    groups:
      github-actions:
        patterns:
          - "*"

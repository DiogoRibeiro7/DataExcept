name: Fix 1.2.0 changelog links

on:
  push:
    branches:
      - release/1.2.0

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/1.2.0
          fetch-depth: 0
      - name: Fix changelog link references and remove helper
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          old = '[Unreleased]: https://github.com/DiogoRibeiro7/DataExcept/compare/v1.1.0...HEAD'
          new = '[Unreleased]: https://github.com/DiogoRibeiro7/DataExcept/compare/v1.2.0...HEAD'
          if old not in text:
              raise SystemExit('expected Unreleased link not found')
          text = text.replace(old, new, 1)
          anchor = '[1.1.0]: https://github.com/DiogoRibeiro7/DataExcept/compare/v1.0.0...v1.1.0'
          if anchor not in text:
              raise SystemExit('expected 1.1.0 link not found')
          text = text.replace(
              anchor,
              '[1.2.0]: https://github.com/DiogoRibeiro7/DataExcept/compare/v1.1.0...v1.2.0\n' + anchor,
              1,
          )
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/fix-1-2-0-changelog-links.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .github/workflows/fix-1-2-0-changelog-links.yml
          git commit -m 'docs: fix 1.2.0 changelog links'
          git push origin HEAD:release/1.2.0

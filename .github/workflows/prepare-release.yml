name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version to prepare, for example 1.4.0
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z, got '${RELEASE_VERSION}'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install Poetry 2.4.2
        run: pipx install poetry==2.4.2

      - name: Ensure target is newer than main
        run: |
          set -euo pipefail
          CURRENT="$(poetry version -s)"
          python - "${CURRENT}" "${RELEASE_VERSION}" <<'PY'
          import sys
          from packaging.version import Version

          current = Version(sys.argv[1])
          target = Version(sys.argv[2])
          if target <= current:
              raise SystemExit(f"target {target} must be newer than current {current}")
          PY

      - name: Prepare release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="release/${RELEASE_VERSION}"
          git switch -c "${BRANCH}"
          python scripts/bump_version.py "${RELEASE_VERSION}"
          python scripts/prepare_release.py "${RELEASE_VERSION}"
          poetry check --lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml CITATION.cff CHECKLIST.md SECURITY.md CHANGELOG.md ROADMAP.md
          git commit -m "release: ${RELEASE_VERSION}"
          git push origin "HEAD:${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "release: ${RELEASE_VERSION}" \
            --body "Prepare DataExcept ${RELEASE_VERSION} for release. After this PR is green and merged, run the permanent Release workflow with version ${RELEASE_VERSION}."

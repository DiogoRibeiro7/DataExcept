name: Release

# Releases are normally driven by tags. Automation may also request release of
# an existing tag through repository_dispatch. Unlike workflow_dispatch,
# repository_dispatch always executes the workflow definition from the default
# branch, so a caller cannot select an untrusted branch's release logic.
#
# Both paths run the same release gates. A tag by itself proves nothing, so the
# build job checks that the tag exists, resolves to a commit on main, that CI
# passed on that exact commit, and that the tag matches the project version. The
# wheel is then tested before anything is published.
on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types:
      - release_tag

env:
  RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Validate release request
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '${RELEASE_TAG}'."
            exit 1
          fi
          echo "Release request is for ${RELEASE_TAG}."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # repository_dispatch is executed from main, but the package must be
          # built from the existing release tag. Prefixing the payload with
          # refs/tags/ means a same-named branch can never be selected.
          ref: ${{ github.event_name == 'repository_dispatch' && format('refs/tags/{0}', github.event.client_payload.tag) || github.ref }}
          # Needed to prove the tagged commit is reachable from main.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8 # v4

      - name: Resolve and verify the release tag
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "::error::Tag ${RELEASE_TAG} does not exist."
            exit 1
          fi
          TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "${TAG_SHA}" != "${RELEASE_SHA}" ]; then
            echo "::error::Checked-out commit ${RELEASE_SHA} does not match ${RELEASE_TAG} (${TAG_SHA})."
            exit 1
          fi
          echo "RELEASE_SHA=${RELEASE_SHA}" >> "${GITHUB_ENV}"

      - name: Verify the tag points at a commit on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/main; then
            echo "::error::${RELEASE_TAG} does not point at a commit on main."
            echo "::error::Only reviewed, merged code may be released."
            exit 1
          fi
          echo "${RELEASE_TAG} is on main."

      - name: Verify CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Require exactly what branch protection requires, green, on this
          # commit -- a tag can otherwise be pushed to unreviewed code.
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs" \
            --jq '.check_runs[] | [.name, .conclusion] | @tsv' > checks.tsv
          failed=0
          while IFS= read -r required; do
            conclusion="$(awk -F'\t' -v n="$required" '$1 == n {print $2; exit}' checks.tsv)"
            if [ "$conclusion" != "success" ]; then
              echo "::error::Required check '${required}' is '${conclusion:-missing}'."
              failed=1
            fi
          done <<'REQUIRED'
          quality
          test (3.10)
          test (3.11)
          test (3.12)
          test (3.13)
          test (3.14)
          coverage
          docs
          REQUIRED
          rm -f checks.tsv
          [ "$failed" -eq 0 ] || exit 1
          echo "All required checks passed on ${RELEASE_SHA}."

      - name: Verify the tag matches the project version
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PROJECT_VERSION="$(poetry version -s)"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match the version in pyproject.toml (${PROJECT_VERSION})."
            echo "::error::Bump the version and merge it before tagging."
            exit 1
          fi
          echo "Releasing ${PROJECT_VERSION}"

      - name: Build
        run: poetry build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify-wheel:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate release request
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '${RELEASE_TAG}'."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && format('refs/tags/{0}', github.event.client_payload.tag) || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8 # v4
      - name: Run the test suite against the installed wheel
        run: |
          # Test requirements come from the lock rather than a hand-written
          # list here, which went stale the moment hypothesis was added.
          # --no-root so the source project is not installed: the wheel is
          # what is under test.
          poetry install --only dev --no-root
          poetry run pip install dist/*.whl
          # Delete the source package so the tests can only import the wheel.
          # The rest of the checkout stays: some tests read pyproject, README
          # and docs.
          rm -rf dataexcept
          poetry run pytest -q
      - name: Check the wheel ships what it should
        run: poetry run python scripts/check_wheel.py

  publish:
    needs: [build, verify-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/DataExcept
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag

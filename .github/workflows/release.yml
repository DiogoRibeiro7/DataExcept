name: Release

# Releases are driven by tags. Bump the version in a pull request, merge it,
# then push a matching tag:
#
#   make release-prep PART=patch   # or minor / major
#   # commit, open a PR, merge it, then on main:
#   git tag "v$(poetry version -s)" && git push origin "v$(poetry version -s)"
#
# Nothing here writes to main, so this works with branch protection.
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: abatilo/actions-poetry@v4
      - name: Verify the tag matches the project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(poetry version -s)"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the version in pyproject.toml (${PROJECT_VERSION})."
            echo "::error::Bump the version and merge it before tagging."
            exit 1
          fi
          echo "Releasing ${PROJECT_VERSION}"
      - name: Build
        run: poetry build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/DataExcept
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

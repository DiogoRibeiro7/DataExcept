name: Release

# The privileged release workflow is invoked only through repository_dispatch.
# GitHub always loads repository_dispatch workflows from the default branch, so
# callers cannot select a modified branch containing different publishing logic.
on:
  repository_dispatch:
    types:
      - release_tag

concurrency:
  group: release-${{ github.event.client_payload.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.client_payload.tag }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Validate release request
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be vX.Y.Z without leading zeroes; got '${RELEASE_TAG}'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8 # v4
        with:
          poetry-version: '2.4.2'

      - name: Verify project version and exact main commit
        id: release
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_TAG#v}"
          PROJECT_VERSION="$(poetry version -s)"
          if [ "${PROJECT_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "::error::main is ${PROJECT_VERSION}, requested ${RELEASE_VERSION}."
            echo "::error::Prepare and merge the release metadata first."
            exit 1
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "release_sha=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Verify required CI passed on exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs" \
            --jq '.check_runs[] | [.name, .conclusion] | @tsv' > checks.tsv
          failed=0
          while IFS= read -r required; do
            conclusion="$(awk -F'\t' -v n="$required" '$1 == n {print $2; exit}' checks.tsv)"
            if [ "$conclusion" != "success" ]; then
              echo "::error::Required check '${required}' is '${conclusion:-missing}'."
              failed=1
            fi
          done <<'REQUIRED'
          quality
          test (3.10)
          test (3.11)
          test (3.12)
          test (3.13)
          test (3.14)
          coverage
          docs
          REQUIRED
          rm -f checks.tsv
          [ "$failed" -eq 0 ] || exit 1

      - name: Verify annotated release tag
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "::error::Annotated tag ${RELEASE_TAG} does not exist."
            echo "::error::Create it on ${RELEASE_SHA} before dispatching this workflow."
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]; then
            echo "::error::${RELEASE_TAG} exists but is not an annotated tag."
            exit 1
          fi
          TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "${TAG_SHA}" != "${RELEASE_SHA}" ]; then
            echo "::error::${RELEASE_TAG} points to ${TAG_SHA}, expected ${RELEASE_SHA}."
            exit 1
          fi

  build:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8 # v4
        with:
          poetry-version: '2.4.2'
      - name: Build
        run: poetry build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify-wheel:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8 # v4
        with:
          poetry-version: '2.4.2'
      - name: Run the test suite against the installed wheel
        run: |
          poetry install --only dev --no-root
          poetry run pip install dist/*.whl
          rm -rf dataexcept
          poetry run pytest -q
      - name: Check wheel contents
        run: poetry run python scripts/check_wheel.py

  publish:
    needs: [build, verify-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/DataExcept
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag

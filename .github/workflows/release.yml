name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version already merged into main, for example 1.4.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: v${{ inputs.version }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    steps:
      - name: Validate version
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z, got '${RELEASE_VERSION}'."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8 # v4
        with:
          poetry-version: '2.4.2'

      - name: Verify project version
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(poetry version -s)"
          if [ "${PROJECT_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "::error::main is ${PROJECT_VERSION}, requested ${RELEASE_VERSION}."
            echo "::error::Run Prepare Release and merge its PR first."
            exit 1
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Verify required CI passed on exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs" \
            --jq '.check_runs[] | [.name, .conclusion] | @tsv' > checks.tsv
          failed=0
          while IFS= read -r required; do
            conclusion="$(awk -F'\t' -v n="$required" '$1 == n {print $2; exit}' checks.tsv)"
            if [ "$conclusion" != "success" ]; then
              echo "::error::Required check '${required}' is '${conclusion:-missing}'."
              failed=1
            fi
          done <<'REQUIRED'
          quality
          test (3.10)
          test (3.11)
          test (3.12)
          test (3.13)
          test (3.14)
          coverage
          docs
          REQUIRED
          rm -f checks.tsv
          [ "$failed" -eq 0 ] || exit 1

      - name: Create or verify annotated release tag
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [ "${TAG_SHA}" != "${RELEASE_SHA}" ]; then
              echo "::error::${RELEASE_TAG} already points to ${TAG_SHA}, expected ${RELEASE_SHA}."
              exit 1
            fi
            echo "${RELEASE_TAG} already exists on the correct commit."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" -m "DataExcept ${RELEASE_VERSION}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

  build:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8 # v4
        with:
          poetry-version: '2.4.2'
      - name: Build
        run: poetry build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify-wheel:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8 # v4
        with:
          poetry-version: '2.4.2'
      - name: Run the test suite against the installed wheel
        run: |
          poetry install --only dev --no-root
          poetry run pip install dist/*.whl
          rm -rf dataexcept
          poetry run pytest -q
      - name: Check wheel contents
        run: poetry run python scripts/check_wheel.py

  publish:
    needs: [build, verify-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/DataExcept
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" \
            --generate-notes \
            --verify-tag

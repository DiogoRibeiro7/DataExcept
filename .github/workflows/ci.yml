name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest coverage coverage-badge ruff
      - name: Lint
        run: flake8 dataexcept tests
      - name: Ruff
        run: ruff check .
      - name: Test with coverage
        run: |
          coverage run -m pytest -q
          coverage xml -o coverage.xml
      - uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            .coverage
            coverage.xml

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage_files
          merge-multiple: true
      - name: Combine coverage
        run: |
          python -m pip install coverage coverage-badge
          coverage combine coverage_files
          coverage xml -o coverage.xml
          coverage html -d htmlcov
          coverage-badge -o coverage.svg -f
      - name: Commit updated coverage badge
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage badge"
          commit_user_name: github-actions
          commit_user_email: github-actions@github.com
          file_pattern: coverage.svg
      - uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.svg
            htmlcov

  docs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx myst-parser furo
      - name: Build documentation
        run: sphinx-build -b html docs docs/_build/html
      - uses: actions/upload-artifact@v5
        with:
          name: docs-html
          path: docs/_build/html

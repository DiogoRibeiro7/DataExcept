name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: abatilo/actions-poetry@v4
      - name: Verify the lock file matches pyproject.toml
        run: poetry check --lock
      - name: Install quality tools
        run: poetry install --only dev --no-root
      - name: Ruff
        run: poetry run ruff check .
      - name: Flake8
        run: poetry run flake8 dataexcept tests
      - name: Black
        run: poetry run black --check --diff dataexcept tests examples scripts
      - name: isort
        run: poetry run isort --check-only --diff dataexcept tests examples scripts
      - name: mypy
        run: poetry run mypy dataexcept

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: abatilo/actions-poetry@v4
      - name: Install dependencies
        run: poetry install --with dev
      - name: Test with coverage
        run: |
          poetry run coverage run -m pytest -q
          mv .coverage .coverage.${{ matrix.python-version }}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage.${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage_files
          merge-multiple: true
      - uses: abatilo/actions-poetry@v4
      - name: Install coverage tooling
        run: poetry install --only dev --no-root
      - name: Combine coverage
        run: |
          poetry run coverage combine coverage_files
          poetry run coverage xml -o coverage.xml
          poetry run coverage html -d htmlcov
          poetry run python scripts/coverage_badge.py -o coverage.svg
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.svg
            htmlcov
          if-no-files-found: error

  docs:
    needs: [test, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
      - name: Build documentation
        run: mkdocs build --strict
      - uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: coverage_report
      - name: Publish the coverage badge and HTML report with the docs
        run: |
          cp coverage_report/coverage.svg site/coverage.svg
          cp -r coverage_report/htmlcov site/htmlcov
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-docs:
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    # Let a running deployment finish rather than publishing half a site.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

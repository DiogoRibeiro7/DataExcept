name: Apply PR 60 review fix

on:
  push:
    branches:
      - feat/1.3-exception-groups

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/1.3-exception-groups
          fetch-depth: 0
      - name: Guard hostile group metadata, add regression, update docs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          serialization = Path("dataexcept/serialization.py")
          text = serialization.read_text(encoding="utf-8")
          old = '''    members: object = getattr(exc, "exceptions", None)\n    if not isinstance(members, tuple):\n        return None\n    if not all(isinstance(member, BaseException) for member in members):\n        return None\n    return members\n'''
          new = '''    try:\n        members: object = getattr(exc, "exceptions", None)\n        if not isinstance(members, tuple):\n            return None\n        if not all(isinstance(member, BaseException) for member in members):\n            return None\n        return members\n    except Exception:\n        return None\n'''
          if text.count(old) != 1:
              raise SystemExit("expected one group-member extraction block")
          serialization.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          tests = Path("tests/test_structured_serialization.py")
          text = tests.read_text(encoding="utf-8")
          anchor = '''def test_exception_to_json_is_strict_json() -> None:\n'''
          regression = '''def test_exception_group_survives_hostile_member_metadata() -> None:\n    group_type = getattr(builtins, "ExceptionGroup", None)\n    if group_type is None:\n        pytest.skip("ExceptionGroup is Python 3.11+")\n\n    def raise_on_members(_: object) -> tuple[BaseException, ...]:\n        raise RuntimeError("no members for you")\n\n    hostile_type = type(\n        "HostileExceptionGroup",\n        (group_type,),\n        {"exceptions": property(raise_on_members)},\n    )\n    group = hostile_type("parallel failures", [ValueError("bad row")])\n\n    payload = exception_to_dict(group)\n\n    assert payload["type"] == "HostileExceptionGroup"\n    assert "exceptions" not in payload\n    assert "parallel failures" in payload["message"]\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("expected one strict-json test anchor")
          if "test_exception_group_survives_hostile_member_metadata" not in text:
              text = text.replace(anchor, regression + anchor, 1)
          tests.write_text(text, encoding="utf-8", newline="\n")

          docs = Path("docs/advanced_usage.md")
          text = docs.read_text(encoding="utf-8")
          anchor = '''Python 3.10 remains supported. There is no `exceptiongroup` runtime dependency;\nthe group-specific behavior simply becomes available when the interpreter\nprovides the built-in group types.\n'''
          addition = anchor + '''\nA custom group subclass with malformed or raising `exceptions` metadata cannot\nbreak serialization. In that case DataExcept falls back to the ordinary\nexception record and omits the `exceptions` key rather than replacing the\noriginal failure with a serialization error.\n'''
          if text.count(anchor) != 1:
              raise SystemExit("expected one ExceptionGroup compatibility paragraph")
          text = text.replace(anchor, addition, 1)
          docs.write_text(text, encoding="utf-8", newline="\n")
          PY
          rm .github/workflows/fix-pr60-hostile-group.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dataexcept/serialization.py tests/test_structured_serialization.py docs/advanced_usage.md .github/workflows/fix-pr60-hostile-group.yml
          git commit -m 'fix: tolerate hostile exception group metadata'
          git push origin HEAD:feat/1.3-exception-groups

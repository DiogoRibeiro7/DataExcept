name: Prepare 1.3.0 release metadata

on:
  push:
    branches:
      - release/1.3.0

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/1.3.0
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - name: Install Poetry 2.4.2
        run: pipx install poetry==2.4.2
      - name: Prepare release metadata
        run: |
          set -euo pipefail
          python scripts/bump_version.py minor
          python - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n\n'
          section = '''## [Unreleased]\n\n## [1.3.0] - 2026-09-03\n\n### Added\n\n- **Structured `ExceptionGroup` support** on Python 3.11+:\n  `exception_to_dict` and `exception_to_json` now preserve group members under\n  an `exceptions` field, including nested groups, instead of flattening\n  concurrent failures into one rendered message.\n- Group members use the same public-attribute, redaction, cycle and shared\n  `max_depth` guarantees as ordinary causes and contexts. Python 3.10 remains\n  supported without an `exceptiongroup` backport or additional runtime\n  dependency.\n\n### Changed\n\n- Hostile or malformed exception-group member metadata now degrades to the\n  ordinary exception record rather than allowing serialization itself to fail.\n- The README now uses a PyPI-backed version badge and avoids hard-coded version\n  and citation values that can drift between releases. The documented exception\n  count is contract-tested against the package.\n- The roadmap now records a future language-neutral envelope schema and optional\n  Pino interoperability track without claiming Node.js/Pino support today.\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('expected one Unreleased marker')
          text = text.replace(marker, section, 1)
          text = text.replace(
              '[Unreleased]: https://github.com/DiogoRibeiro7/DataExcept/compare/v1.2.0...HEAD',
              '[Unreleased]: https://github.com/DiogoRibeiro7/DataExcept/compare/v1.3.0...HEAD\n'
              '[1.3.0]: https://github.com/DiogoRibeiro7/DataExcept/compare/v1.2.0...v1.3.0',
              1,
          )
          changelog.write_text(text, encoding='utf-8', newline='\n')

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '''## Landed for 1.3.0 — Structured concurrent failures\n\nThe implementation is on `main`; it will become a released feature when the\n1.3.0 release is cut.\n\n'''
          new = '''## Shipped in 1.3.0 — Structured concurrent failures\n\n'''
          if text.count(old) != 1:
              raise SystemExit('expected one 1.3 roadmap pre-release block')
          roadmap.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          bump = Path('scripts/bump_version.py')
          text = bump.read_text(encoding='utf-8')
          old = '''    print(f"  3. git tag v{version} && git push origin v{version}")\n    print("     Pushing the tag builds, publishes to PyPI and cuts the release.")\n'''
          new = '''    print(f"  3. Create and push annotated tag v{version} on the merged release commit")\n    print("  4. Dispatch the guarded Release workflow with event_type=release_tag")\n    print(f"     and payload tag=v{version}")\n    print("  5. Approve the pypi environment deployment when prompted")\n'''
          if text.count(old) != 1:
              raise SystemExit('expected one stale release instruction block')
          bump.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/prepare-release-1-3-0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml CITATION.cff CHECKLIST.md SECURITY.md CHANGELOG.md ROADMAP.md scripts/bump_version.py .github/workflows/prepare-release-1-3-0.yml
          git commit -m 'release: 1.3.0'
          git push origin HEAD:release/1.3.0

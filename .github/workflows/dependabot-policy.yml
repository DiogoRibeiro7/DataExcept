name: Dependabot Policy

on:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - "pyproject.toml"
      - "poetry.lock"
      - ".pre-commit-config.yaml"
      - ".github/workflows/dependabot-policy.yml"
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - "pyproject.toml"
      - "poetry.lock"
      - ".pre-commit-config.yaml"
      - ".github/workflows/dependabot-policy.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Dependabot policy
        uses: DiogoRibeiro7/safe-dependabot@3ff627fe5c985b52d5ca3bb41141bd2d0f76691f # v1.0.0

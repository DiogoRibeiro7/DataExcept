name: Prepare 1.1.0

on:
  push:
    branches: [release/1.1.0]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/1.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Prepare release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = "1.1.0"
          today = "2026-09-02"

          def replace_once(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {pattern!r}, got {count}")
              p.write_text(text, encoding="utf-8", newline="\n")

          replace_once("pyproject.toml", r'^version = "1\.0\.0"$', f'version = "{version}"')
          replace_once("CITATION.cff", r'^version: "1\.0\.0"$', f'version: "{version}"')
          replace_once("CITATION.cff", r'^date-released: "2026-08-25"$', f'date-released: "{today}"')
          replace_once(
              "CHECKLIST.md",
              r'current as of 1\.0\.0 \(2026-08-25\)',
              f'current as of {version} ({today})',
          )
          replace_once("SECURITY.md", r'\| 1\.0\.x \|', '| 1.1.x |')
          replace_once("SECURITY.md", r'\| < 1\.0 \|', '| < 1.1 |')
          replace_once(
              "SECURITY.md",
              r'DataExcept is pre-1\.0\. Security fixes are applied to the latest released\nversion only\.',
              'Security fixes are applied to the latest released minor series only.',
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "## [Unreleased]\n\n### Added"
          if text.count(marker) != 1:
              raise SystemExit("unexpected Unreleased changelog shape")
          text = text.replace(
              marker,
              f"## [Unreleased]\n\n## [{version}] - {today}\n\n### Added",
              1,
          )
          old_ref = "[Unreleased]: https://github.com/DiogoRibeiro7/DataExcept/compare/v1.0.0...HEAD"
          new_refs = (
              f"[Unreleased]: https://github.com/DiogoRibeiro7/DataExcept/compare/v{version}...HEAD\n"
              f"[{version}]: https://github.com/DiogoRibeiro7/DataExcept/compare/v1.0.0...v{version}"
          )
          if text.count(old_ref) != 1:
              raise SystemExit("unexpected changelog reference shape")
          text = text.replace(old_ref, new_refs, 1)
          changelog.write_text(text, encoding="utf-8", newline="\n")

          Path(".github/workflows/prepare-1-1-0.yml").unlink()
          PY
      - name: Commit release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CITATION.cff CHECKLIST.md SECURITY.md CHANGELOG.md .github/workflows/prepare-1-1-0.yml
          git commit -m "release: 1.1.0"
          git push origin HEAD:release/1.1.0

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 06:17 UTC. New advisories are published against code that has not
    # changed, so this needs to run on a clock and not only on push.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:python

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      # Scoped to the project's own dependency sets rather than the whole
      # environment: a bare `pip-audit` also audits pip and setuptools, so an
      # advisory against the runner's toolchain would fail a build that has
      # nothing to do with it.
      - name: Audit the runtime dependencies
        run: pip-audit --strict --progress-spinner off .
      - name: Audit the documentation dependencies
        run: pip-audit --strict --progress-spinner off -r docs/requirements.txt

  dependency-review:
    name: Dependency review
    # Only meaningful on a pull request, where there is a base to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: moderate

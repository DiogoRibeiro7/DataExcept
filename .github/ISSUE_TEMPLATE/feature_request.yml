name: Feature request
description: Suggest a new exception, helper, or change to an existing one.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the failure you are trying to represent, not the API you have
        in mind. Which generic exception are you reaching for today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How would it look at the call site?
      render: python

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is this?
      options:
        - A new exception class
        - A change to an existing exception
        - A logging helper
        - CLI or tooling
        - Documentation
        - Something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including deriving it yourself from an existing base class.
